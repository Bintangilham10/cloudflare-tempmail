# Safe source-controlled skeleton. Add account-specific D1, R2, rate-limit,
# route, and vars blocks only after the Cloudflare resources are provisioned.
# `npm run deploy` refuses to deploy while those bindings are missing.

name = "tempmail-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[triggers]
crons = ["0 * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.05
